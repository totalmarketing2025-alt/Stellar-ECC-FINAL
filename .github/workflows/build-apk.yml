name: Flutter APK Build

on:
  push:
    branches:
      - main
      - 'block6-*'
      - 'fix/notification-call-actions-20261112'
      - 'fix/push-notification-dedup-final-20261117'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get packages
        run: flutter pub get

      - name: Test call action and lock-screen contracts
        run: flutter test test/call_notification_action_contract_test.dart

      - name: Test push notification dedup contracts
        run: flutter test test/push_notification_dedup_contract_test.dart

      - name: Test Wanted Mode notification and monitoring contracts
        run: flutter test test/wanted_mode_reliability_contract_test.dart

      - name: Test Wanted Mode battery contracts
        run: flutter test test/wanted_mode_battery_guard_contract_test.dart

      - name: Build APK
        run: flutter build apk --release

      - name: Test Android Wanted Mode battery threshold policy
        run: cd android && ./gradlew :app:testDebugUnitTest --tests 'ecc.stellar.app.WantedModeBatteryGuardPolicyTest' --no-daemon

      - name: Test Android purple edge lighting opt-in policy
        run: cd android && ./gradlew :app:testDebugUnitTest --tests 'ecc.stellar.app.StellarEdgeLightingPolicyTest' --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stellar-ecc-apk
          path: build/app/outputs/flutter-apk/app-release.apk
