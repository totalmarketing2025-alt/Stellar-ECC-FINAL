name: Flutter APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter setup
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"

      - name: Get dependencies
        run: flutter pub get

      - name: Fix flutter_jailbreak_detection
        run: |
          FILE=$(find ~/.pub-cache -path "*flutter_jailbreak_detection*/android/build.gradle" | head -1)
          if [ -n "$FILE" ]; then
            sed -i '/android {/a\    namespace "com.flutter_jailbreak_detection"' "$FILE"
          fi

      - name: Fix record_android
        run: |
          RECORD=$(find ~/.pub-cache -path "*record_android*/android/build.gradle" | head -1)
          if [ -n "$RECORD" ]; then
            sed -i '/android {/a\    namespace "com.llfbandit.record"' "$RECORD"
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@
