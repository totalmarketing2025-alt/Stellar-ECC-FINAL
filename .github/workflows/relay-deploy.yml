name: Relay Deploy

on:
  push:
    branches:
      - main
      - block6-android-incoming-call
    paths:
      - "backend/cloudflare-relay/**"
      - ".github/workflows/relay-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: backend/cloudflare-relay
        run: npm install

      - name: Deploy Relay Worker
        working-directory: backend/cloudflare-relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy

      - name: Configure FCM Worker Secrets
        working-directory: backend/cloudflare-relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FCM_CLIENT_EMAIL: ${{ secrets.FCM_CLIENT_EMAIL }}
          FCM_PRIVATE_KEY: ${{ secrets.FCM_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$FCM_CLIENT_EMAIL" || -z "$FCM_PRIVATE_KEY" ]]; then
            echo "::error::FCM GitHub Secrets are missing."
            exit 1
          fi
          printf '%s' "$FCM_CLIENT_EMAIL" | npx wrangler secret put FCM_CLIENT_EMAIL
          printf '%s' "$FCM_PRIVATE_KEY" | npx wrangler secret put FCM_PRIVATE_KEY
# FCM deploy trigger
