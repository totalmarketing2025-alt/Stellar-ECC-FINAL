name: Relay Deploy

on:
  push:
    branches:
      - main
      - block6-android-incoming-call
    paths:
      - "backend/cloudflare-relay/**"
      - ".github/workflows/relay-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: backend/cloudflare-relay
        run: npm install

      - name: Deploy Relay Worker
        working-directory: backend/cloudflare-relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy
# FCM deploy trigger
