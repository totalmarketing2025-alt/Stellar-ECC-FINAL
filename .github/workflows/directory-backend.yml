name: Directory Backend Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  directory-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/cloudflare-directory

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Wrangler configuration
        run: npx wrangler@4.129.0 deploy --dry-run
