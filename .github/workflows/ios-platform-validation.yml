name: iOS Isolation Validation

on:
  push:
    branches: [windows-platform-implementation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-compile:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - name: Resolve packages
        run: flutter pub get
      - name: Compile iOS without signing
        run: flutter build ios --debug --no-codesign
