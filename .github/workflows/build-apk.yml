name: Flutter Debug APK Build

on:
  push:
    branches:
      - main
      - feature/ios-platform
      - 'block6-*'
      - 'fix/notification-call-actions-20261112'
      - 'fix/push-notification-dedup-final-20261117'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get packages
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Test Android Wanted Mode battery threshold policy
        run: cd android && ./gradlew :app:testDebugUnitTest --tests 'ecc.stellar.app.WantedModeBatteryGuardPolicyTest' --no-daemon

      - name: Test Android purple edge lighting opt-in policy
        run: cd android && ./gradlew :app:testDebugUnitTest --tests 'ecc.stellar.app.StellarEdgeLightingPolicyTest' --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stellar-ecc-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
