name: Flutter APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter setup
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"

      - name: Get dependencies
        run: flutter pub get

      - name: Fix flutter_jailbreak_detection namespace
        run: |
          FILE=$(find ~/.pub-cache -path "*flutter_jailbreak_detection-1.10.0/android/build.gradle" | head -1)
          echo $FILE
          if [ -n "$FILE" ]; then
            sed -i '/android {/a\    namespace "com.flutter_jailbreak_detection"' "$FILE"
          fi

      - name: Build APK
        run: flutter build apk --
