name: STELLAR Guard Staging Verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard-staging:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/stellar-guard-deployment-verification'
    runs-on: ubuntu-latest
    environment: guard-staging
    defaults:
      run:
        working-directory: backend/cloudflare-directory

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check separately scoped staging credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          GUARD_STAGING_REVIEW_SECRET: ${{ secrets.GUARD_STAGING_REVIEW_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$GUARD_STAGING_REVIEW_SECRET" ]]; then
            echo 'Missing guard-staging credentials. No deployment attempted.' >&2
            exit 1
          fi
          if [[ ${#GUARD_STAGING_REVIEW_SECRET} -lt 32 ]]; then
            echo 'Staging review secret is too short. No deployment attempted.' >&2
            exit 1
          fi

      - name: Test Guard protocol and case audit locally
        run: node --test tests/guard_code.test.mjs tests/guard_case.test.mjs tests/guard_audit.test.mjs tests/guard_staging_safety.test.mjs

      - name: Deploy isolated staging Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
        run: npx wrangler@4.129.0 deploy --env staging

      - name: Run signed Guard staging API smoke tests
        env:
          GUARD_STAGING_REVIEW_SECRET: ${{ secrets.GUARD_STAGING_REVIEW_SECRET }}
        run: node tests/guard_staging_smoke.mjs
