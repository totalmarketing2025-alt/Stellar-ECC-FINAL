name: Guard Phase 05 verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test backend/cloudflare-directory/tests/guard_case.test.mjs backend/cloudflare-directory/tests/guard_audit.test.mjs backend/cloudflare-relay/tests/guard_moderator_proxy.test.mjs backend/cloudflare-relay/tests/guard_revoke_room.test.mjs

  flutter-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
      - run: flutter pub get
      - run: flutter test test/guard_phase05_contract_test.dart
      - run: flutter test test/stellar_guard_protocol_test.dart test/stellar_guard_service_test.dart test/stellar_guard_screen_test.dart

  android-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --debug
      - run: cd android && ./gradlew :app:testDebugUnitTest --tests 'ecc.stellar.app.StellarEdgeLightingPolicyTest' --no-daemon
      - name: Upload call-switch test APK
        uses: actions/upload-artifact@v4
        with:
          name: stellar-call-switch-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
