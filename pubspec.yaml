name: stellar_ecc
description: Stellar ECC — privacy-first, ephemeral, end-to-end encrypted messenger.
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Cryptography
  libsignal_protocol_dart: ^0.4.0
  cryptography: ^2.7.0
  pointycastle: ^3.9.1
  crypto: ^3.0.6

  # Storage
  sqlite3: ^2.4.6
  sqlcipher_flutter_libs: ^0.6.4
  path_provider: ^2.1.3
  path: ^1.9.0

  # Firebase
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0

  # Security
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2

  # Files / Media
  file_picker: ^8.0.6
  image_picker: ^1.1.2

  # QR
  qr_flutter: ^4.1.0

  # Utils
  uuid: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
