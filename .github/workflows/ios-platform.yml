name: Stellar ECC iOS Platform

on:
  push:
    branches: [feature/ios-platform]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Generate missing iOS Xcode project files
        run: bash tool/prepare_ios_project.sh

      - name: Get packages
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze shared Flutter code
        run: flutter analyze

      - name: Run unit and widget tests
        run: flutter test

      - name: Build unsigned iOS simulator app
        run: flutter build ios --simulator --no-codesign

      - name: Boot an iPhone simulator
        id: simulator
        shell: bash
        run: |
          device_id="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          devices = [d for group in data["devices"].values() for d in group
                     if d.get("isAvailable") and d["name"].startswith("iPhone")]
          if not devices:
              raise SystemExit("No available iPhone simulator found")
          print(devices[0]["udid"])
          ')"
          echo "device_id=$device_id" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" -b

      - name: Verify iOS SQLCipher and Keychain startup
        run: flutter test integration_test/ios_sqlcipher_smoke_test.dart -d '${{ steps.simulator.outputs.device_id }}'
