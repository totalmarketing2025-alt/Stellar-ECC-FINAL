name: Stellar ECC Windows Build

on:
  push:
    branches: [main, feature/ios-platform]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    # Flutter 3.27 maps the installed VS 2022 toolchain to this CMake
    # generator. Pin the runner so the toolchain remains predictable.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Download and verify Microsoft C++ runtime
        shell: pwsh
        run: |
          $redist = Join-Path $env:RUNNER_TEMP 'vc_redist.x64.exe'
          Invoke-WebRequest -Uri 'https://aka.ms/vc14/vc_redist.x64.exe' -OutFile $redist
          $signature = Get-AuthenticodeSignature -FilePath $redist
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'CN=Microsoft Corporation') {
            throw 'Downloaded VC++ Redistributable does not have a valid Microsoft signature.'
          }
          "VCRedistPath=$redist" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Package installer
        shell: pwsh
        run: |
          $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($command) {
            $iscc = $command.Source
          } else {
            $iscc = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          & $iscc /DAppVersion=0.1.1 /DBuildDir="$PWD\build\windows\x64\runner\Release" /DVCRedistPath="$env:VCRedistPath" windows\installer\StellarECC.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows release bundle
        uses: actions/upload-artifact@v4
        with:
          name: stellar-ecc-windows-x64-release
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: stellar-ecc-windows-x64-installer
          path: dist/StellarECCSetup-*-x64.exe
          if-no-files-found: error
          retention-days: 30
