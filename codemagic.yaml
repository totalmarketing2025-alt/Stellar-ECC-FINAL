workflows:
  android-workflow:
    name: Android APK Build
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Regenerate Gradle wrapper
        # gradle-wrapper.jar is a binary that can't be committed from an
        # environment without network access to services.gradle.org — see
        # TESTING.md. Codemagic's build machines have Gradle preinstalled,
        # so we regenerate a correct wrapper here rather than relying on a
        # checked-in jar. Same approach as .github/workflows/build-apk.yml.
        script: |
          cd android
          gradle wrapper --gradle-version 8.7
          cd ..
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
