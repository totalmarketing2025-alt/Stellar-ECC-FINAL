name: Directory Backend Test

on:
  push:
    branches:
      - main
      - block6-android-incoming-call
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  directory-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/cloudflare-directory

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run XEd25519 runtime verification
        run: node tests/xeddsa_verify.test.mjs

      - name: Validate Wrangler configuration
        run: npx wrangler@4.129.0 deploy --dry-run

      - name: Check deployment secrets
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TURN_KEY_ID: ${{ secrets.TURN_KEY_ID }}
          TURN_KEY_SECRET: ${{ secrets.TURN_KEY_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$TURN_KEY_ID" || -z "$TURN_KEY_SECRET" ]]; then
            echo "::error::One or more required GitHub Secrets are missing."
            exit 1
          fi

      - name: Deploy Directory Worker
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler@4.129.0 deploy

      - name: Configure TURN Worker Secrets
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TURN_KEY_ID: ${{ secrets.TURN_KEY_ID }}
          TURN_KEY_SECRET: ${{ secrets.TURN_KEY_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file"' EXIT
          chmod 600 "$secret_file"

          node - "$secret_file" <<'NODE'
          const fs = require("node:fs");
          const file = process.argv[2];
          const names = ["TURN_KEY_ID", "TURN_KEY_SECRET"];
          const values = Object.fromEntries(
            names.map((name) => [name, process.env[name]])
          );
          fs.writeFileSync(file, JSON.stringify(values), { mode: 0o600 });
          NODE

          npx wrangler@4.129.0 secret bulk "$secret_file"
