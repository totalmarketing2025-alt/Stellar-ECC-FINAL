name: Group call validation
on:
  push:
    branches: [feature/group-call-engine-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
      - run: flutter pub get
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Flutter analyzer
        run: flutter analyze --no-fatal-infos
      - name: Automated tests
        if: ${{ !cancelled() }}
        run: flutter test
      - name: Android debug compilation
        if: ${{ !cancelled() }}
        run: flutter build apk --debug
      - name: Native group-call wake tests
        if: ${{ !cancelled() }}
        run: cd android && ./gradlew :app:testDebugUnitTest --tests ecc.stellar.app.StellarGroupCallWakeTest --no-daemon
