name: Relay Deploy

on:
  push:
    branches:
      - main
      - block6-android-incoming-call
    paths:
      - "backend/cloudflare-relay/**"
      - ".github/workflows/relay-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: backend/cloudflare-relay
        run: npm install

      - name: Deploy Relay Worker
        working-directory: backend/cloudflare-relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy

      - name: Configure Worker Secrets
        working-directory: backend/cloudflare-relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FCM_CLIENT_EMAIL: ${{ secrets.FCM_CLIENT_EMAIL }}
          FCM_PRIVATE_KEY: ${{ secrets.FCM_PRIVATE_KEY }}
          MODERATOR_USERNAME: ${{ secrets.MODERATOR_USERNAME }}
          MODERATOR_PASSWORD: ${{ secrets.MODERATOR_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$FCM_CLIENT_EMAIL" || -z "$FCM_PRIVATE_KEY" ||
                -z "$MODERATOR_USERNAME" || -z "$MODERATOR_PASSWORD" ]]; then
            echo "::error::One or more required Worker GitHub Secrets are missing."
            exit 1
          fi

          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file"' EXIT
          chmod 600 "$secret_file"

          node - "$secret_file" <<'NODE'
          const fs = require("node:fs");
          const file = process.argv[2];
          const names = [
            "FCM_CLIENT_EMAIL",
            "FCM_PRIVATE_KEY",
            "MODERATOR_USERNAME",
            "MODERATOR_PASSWORD",
          ];
          const values = Object.fromEntries(
            names.map((name) => [name, process.env[name]])
          );
          fs.writeFileSync(file, JSON.stringify(values), { mode: 0o600 });
          NODE

          npx wrangler secret bulk "$secret_file"

# FCM deploy trigger
