name: Relay Test
# trigger after relay deploy

on:
  push:
    branches:
      - main
      - block6-android-incoming-call
  workflow_dispatch:

jobs:
  relay-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Cloudflare Relay health
        run: |
          curl -fsS https://stellar-ecc-final.totalmarketing2025.workers.dev/health

      - name: Test Relay authentication challenge
        run: |
          mkdir -p /tmp/relay-test
          cd /tmp/relay-test

          npm init -y >/dev/null 2>&1
          npm install ws >/dev/null 2>&1

          node --input-type=module <<'NODE'
          import WebSocket from "ws";

          const url =
            "wss://stellar-ecc-final.totalmarketing2025.workers.dev/v1/connect?peer=relay-test";

          const ws = new WebSocket(url);

          const timer = setTimeout(() => {
            console.error("Timed out waiting for relay challenge");
            ws.close();
            process.exit(1);
          }, 10000);

          ws.on("open", () => {
            console.log("WebSocket connected");
          });

          ws.on("message", (data) => {
            const message = data.toString();

            if (!message.startsWith("STELLAR_RELAY_AUTH_CHALLENGE_V1:")) {
              clearTimeout(timer);
              console.error("Unexpected relay message:", message);
              ws.close();
              process.exit(1);
            }

            const challenge =
              message.slice("STELLAR_RELAY_AUTH_CHALLENGE_V1:".length);

            if (!challenge) {
              clearTimeout(timer);
              console.error("Relay challenge is empty");
              ws.close();
              process.exit(1);
            }

            console.log("Relay authentication challenge: PASS");

            /*
             * Deliberately send an invalid authentication response.
             * This must be rejected by the live relay.
             */
            ws.send(
              "STELLAR_RELAY_AUTH_RESPONSE_V1:" +
              JSON.stringify({
                challenge,
                deviceId: 1,
                registrationId: 1,
                signature: "invalid-test-signature",
              }),
            );
          });

          ws.on("close", (code, reason) => {
            clearTimeout(timer);

            console.log(
              `Relay close code: ${code} reason: ${reason.toString()}`,
            );

            if (code !== 1008) {
              console.error(
                "Relay did not reject invalid authentication",
              );
              process.exit(1);
            }

            console.log(
              "Invalid relay authentication rejection: PASS",
            );
            console.log("CLOUDFLARE RELAY TEST PASSED");

            process.exit(0);
          });

          ws.on("error", (error) => {
            clearTimeout(timer);
            console.error("Relay WebSocket error:", error.message);
            process.exit(1);
          });
          NODE
