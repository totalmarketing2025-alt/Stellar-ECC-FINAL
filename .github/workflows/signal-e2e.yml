name: Signal E2E Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  signal-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Run Signal E2E test
        run: flutter test test/signal_e2e_test.dart
